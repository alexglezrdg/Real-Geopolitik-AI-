name: Geopolitik Autopost

# BOT PAUSADO - Desactivado temporalmente
on:
  # DISABLED - Schedule commented out
  # schedule:
  #   - cron: '15 * * * *'

  # Allow manual trigger from GitHub UI (for testing only)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    
    # Prevent concurrent runs to avoid duplicate posts
    concurrency:
      group: autopost
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create data directories
        run: |
          mkdir -p data
          mkdir -p out

      - name: Restore post history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/posted.json
            data/bot.sqlite
            out/news_picker_state.json
          key: post-history-v3
          restore-keys: |
            post-history-v3-

      - name: Verify cache restored
        run: |
          echo "=== Cache verification ==="
          ls -la data/ || echo "data/ not found"
          ls -la out/ || echo "out/ not found"
          if [ -f data/bot.sqlite ]; then
            echo "✓ bot.sqlite exists ($(stat -f%z data/bot.sqlite 2>/dev/null || stat -c%s data/bot.sqlite) bytes)"
            sqlite3 data/bot.sqlite "SELECT COUNT(*) as dedupe_count FROM dedupe_entries;" 2>/dev/null || echo "No dedupe_entries table"
            sqlite3 data/bot.sqlite "SELECT COUNT(*) as topic_count FROM topic_cooldown;" 2>/dev/null || echo "No topic_cooldown table"
          else
            echo "✗ bot.sqlite NOT found - dedup will start fresh"
          fi

      - name: Run autopost bot
        env:
          # Twitter/X API credentials
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          
          # Anthropic API
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: 'claude-3-haiku-20240307'

          # NewsAPI (primary news source)
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

          # Enable live posting (IMAGE_LIVE disabled - using link preview cards)
          X_LIVE: '1'
          # IMAGE_LIVE: '0'  # Disabled - rely on link preview cards from article URLs
          
          # Configuration
          MAX_POSTS_PER_DAY: '20'
        run: npx tsx src/run_once.ts --live

      - name: Save post history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/posted.json
            data/bot.sqlite
            out/news_picker_state.json
          key: post-history-v3-${{ github.run_id }}
